name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.6 LTS
        uses: ./.github/actions/install-pwsh-7-6
      - name: Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Invoke-Pester -CI ./tests
      - name: Catalog builder
        run: |
          python3 -m pip install --user pytest jsonschema
          python3 tools/build_catalog.py --check
          python3 -m pytest tests/test_catalog.py tests/test_verify_stig.py -q
      - name: Demo
        shell: bash
        run: |
          set +e
          pwsh -NoProfile -File ./Invoke-GrundschutzCheck.ps1 -Demo -OutputDirectory "$PWD/out" -Timestamp 2026-10-21T12:00:00Z
          status=$?
          set -e
          test -f "$PWD/out/grundschutzcheck-report.html"
          test -f "$PWD/out/grundschutzcheck-report.md"
          test -f "$PWD/out/grundschutzcheck-report.json"
          test -f "$PWD/out/grundschutzcheck-findings.csv"
          test "$status" -eq 1
      - name: Demo with exceptions and a baseline
        shell: bash
        run: |
          pwsh -NoProfile -File ./Invoke-GrundschutzCheck.ps1 -Demo -OutputDirectory "$PWD/out2" -Timestamp 2026-10-28T12:00:00Z \
            -ExceptionPath examples/exceptions.example.json -BaselinePath "$PWD/out/grundschutzcheck-report.json" -FailOnRegression
          grep -q "Changes since baseline" "$PWD/out2/grundschutzcheck-report.md"
          grep -q "Accepted risk" "$PWD/out2/grundschutzcheck-report.md"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.6 LTS
        uses: ./.github/actions/install-pwsh-7-6
      - name: Pester on PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Invoke-Pester -CI ./tests
      - name: Pester on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Invoke-Pester -CI ./tests

  pester-optional:
    name: Pester (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu pwsh 7.7
            os: ubuntu-latest
          - name: windows pwsh 7.7
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install PowerShell 7.7.0-rc.1 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PWSH_VERSION: 7.7.0-rc.1
          PWSH_SHA256: 3819c69168db599685893f296dca6d2c8c0d67e5109528aff275421bb67afdc8
        run: |
          set -euo pipefail
          asset="powershell-${PWSH_VERSION}-linux-x64.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          curl -fsSL --retry 3 -o "${archive}" "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/${asset}"
          echo "${PWSH_SHA256}  ${archive}" | sha256sum -c -
          dest="${RUNNER_TEMP}/pwsh-${PWSH_VERSION}"
          mkdir -p "${dest}"
          tar -xzf "${archive}" -C "${dest}"
          chmod +x "${dest}/pwsh"
          echo "${dest}" >> "${GITHUB_PATH}"
      - name: Install PowerShell 7.7.0-rc.1 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          PWSH_VERSION: 7.7.0-rc.1
          PWSH_SHA256: 2bb33156e2acefe127a9a5e88583aec9835ee005a215c68280e346b6ebb44182
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $asset = "PowerShell-$env:PWSH_VERSION-win-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_VERSION/$asset" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:PWSH_SHA256) { throw "SHA-256 mismatch for ${asset}: expected $env:PWSH_SHA256, got $actual" }
          $dest = Join-Path $env:RUNNER_TEMP "pwsh-$env:PWSH_VERSION"
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, $dest + "`n")
      - name: Assert pwsh is 7.7
        shell: pwsh
        run: |
          $actual = $PSVersionTable.PSVersion.ToString()
          Write-Host "pwsh $actual at $((Get-Process -Id $PID).Path)"
          if ($actual -notlike '7.7.*') { throw "Expected pwsh 7.7.x, got $actual" }
      - name: Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Invoke-Pester -CI ./tests
